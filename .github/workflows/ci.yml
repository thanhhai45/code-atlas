name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build

  ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-worker/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch_model.py ./models/all-MiniLM-L6-v2
      - run: pytest -q
        env:
          MODEL_DIR: ./models/all-MiniLM-L6-v2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  relevance:
    # Seeds a real Elasticsearch with testdata/, fails if ranking quality drops
    # below the recorded baseline (docs/experiments/03-business-signal-tuning.md),
    # and runs the integration tests that need a live index.
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
          # Runner disks are often above the default watermarks.
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-worker/requirements.txt
      - name: Start the ai-worker (embeddings)
        working-directory: ai-worker
        run: |
          pip install -r requirements.txt
          python scripts/fetch_model.py ./models/all-MiniLM-L6-v2
          MODEL_DIR=./models/all-MiniLM-L6-v2 nohup uvicorn app:app --port 8000 > ../ai-worker.log 2>&1 &
          timeout 60 sh -c 'until curl -fs localhost:8000/health; do sleep 1; done'
      - run: go run ./cmd/crawler -seed testdata/seed_repositories.json
        env:
          EMBEDDINGS_URL: http://localhost:8000
      - name: Zero-downtime reindex (rankeval below then runs on the rebuilt index)
        run: go run ./cmd/crawler -reindex
        env:
          EMBEDDINGS_URL: http://localhost:8000
      - run: go run ./cmd/rankeval -v -min-ndcg 0.95 -min-recall 0.80
      - name: Integration tests (search_after, semantic and hybrid; PostgreSQL upserts)
        run: go test -count=1 -tags integration ./internal/search/ ./internal/store/
        env:
          EMBEDDINGS_URL: http://localhost:8000
      - name: Benchmark smoke test (every workload runs without errors)
        run: |
          go run ./cmd/datagen -n 3000 -alias bench_ci -shards 2 -force-merge
          go run ./cmd/bench -alias bench_ci -c 2 -d 2s -warmup 0 -max-error-rate 0
